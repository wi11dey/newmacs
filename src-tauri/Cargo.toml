[package]
name = "newmacs"
version = "1.0.0"
description = "Beautiful, modern Emacs frontend"
authors = ["Will Dey <will_dey@alumni.harvard.edu>"]
edition = "2021"

[lib]
name = "newmacs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
rand = "0.8"
rouille = "3.6"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
